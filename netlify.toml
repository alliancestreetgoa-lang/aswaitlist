# Netlify build + serving config.
# GitHub Pages needs base '/aswaitlist/' (see vite.config.js); Netlify serves
# from the domain root, so GITHUB_PAGES stays unset here and base resolves to '/'.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 8 requires ^20.19.0 || >=22.12.0 — pin 22 so a 20.x resolution
  # below 20.19 can never break the build.
  NODE_VERSION = "22"

# Still no SPA catch-all on purpose: the legal routes are hash-based
# ('#/privacy', '#/terms'), so every request is for '/' and the server never
# sees them. A catch-all would also turn genuine typos into a 200 home page.
#
# '/thank-you' is the one exception. It has to be a real, shareable URL — it is
# what a confirmation email links to and what a conversion would be recorded
# against — so this single path is rewritten to the app shell, which then
# renders the Thank You route client-side (see src/routes.js). status = 200 is
# a rewrite, not a redirect: the address bar keeps showing /thank-you.
[[redirects]]
  from = "/thank-you"
  to = "/index.html"
  status = 200

# Vite fingerprints these filenames, so they can be cached forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
