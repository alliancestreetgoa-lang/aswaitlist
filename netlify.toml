# Netlify build + serving config.
# GitHub Pages needs base '/aswaitlist/' (see vite.config.js); Netlify serves
# from the domain root, so GITHUB_PAGES stays unset here and base resolves to '/'.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 8 requires ^20.19.0 || >=22.12.0 — pin 22 so a 20.x resolution
  # below 20.19 can never break the build.
  NODE_VERSION = "22"

# No SPA catch-all redirect on purpose: routing is hash-based ('#/privacy',
# '#/terms'), so every request is for '/' and the server never sees the route.

# Vite fingerprints these filenames, so they can be cached forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
